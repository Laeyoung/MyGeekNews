name: Weekly GeekNews Scrape

on:
  schedule:
    # 매주 월요일 한국시간 오전 9시 (UTC 0시)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.GEEKNEWS_ID }}" ] || [ -z "${{ secrets.GEEKNEWS_PASSWORD }}" ]; then
            echo "::error::GEEKNEWS_ID and GEEKNEWS_PASSWORD secrets must be set in repository settings."
            exit 1
          fi

      - name: Create .env file
        run: |
          echo "GEEKNEWS_ID=${{ secrets.GEEKNEWS_ID }}" > .env
          echo "PASSWORD=${{ secrets.GEEKNEWS_PASSWORD }}" >> .env

      - name: Run scraper
        run: python3 scrape_geeknews.py

      - name: Commit and push if changed
        if: ${{ hashFiles('data/geeknews_my_upvotes.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/geeknews_my_upvotes.json
          git diff --staged --quiet || git commit -m "chore: weekly scrape $(date -u +%Y-%m-%d)"
          git push
